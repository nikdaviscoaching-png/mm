name: SpecimenCamera

options:
  bundleIdPrefix: com.nikdaviscoaching
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    # No team is hard-coded: pick your Personal Team once in Xcode (Signing & Capabilities); automatic signing does the rest.
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  SpecimenCore:
    path: Packages/SpecimenCore

targets:
  SpecimenCamera:
    type: application
    platform: iOS
    sources:
      - path: SpecimenCamera
        excludes:
          - "Resources/Info.plist"
    dependencies:
      - package: SpecimenCore
        product: SpecimenCore
      # Synthetic datasets for the developer-only "Test pipelines" screen (Settings › Developer).
      - package: SpecimenCore
        product: SpecimenTestKit
    info:
      path: SpecimenCamera/Resources/Info.plist
      properties:
        CFBundleDisplayName: SPECIMEN CAMERA
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - arm64
          - still-camera
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: true
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: "SPECIMEN CAMERA uses the rear camera to photograph specimens. Everything stays on this phone."
        NSPhotoLibraryAddUsageDescription: "Finished photographs are saved to your Photos library when you choose to."
        NSPhotoLibraryUsageDescription: "Used only to import existing images you select as a focus, lighting or combined stack. Originals are never modified or deleted."
        NSMotionUsageDescription: "Used for the level indicator and to warn you if the phone moves during a stack."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nikdaviscoaching.specimencamera
        TARGETED_DEVICE_FAMILY: "1"          # iPhone only
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: SpecimenCamera/Resources/Info.plist
        SWIFT_EMIT_LOC_STRINGS: NO

schemes:
  SpecimenCamera:
    build:
      targets:
        SpecimenCamera: all
    run:
      config: Debug
    archive:
      config: Release
